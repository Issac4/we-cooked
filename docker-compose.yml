# Local production-like run: builds the image from this checkout.
#   cp .env.example .env   (then set ADMIN_PASSWORD)
#   docker compose up --build
# Then open http://localhost:8000
#
# For day-to-day coding use `npm run dev` instead (hot reload).
services:
  app:
    build:
      context: .
      args:
        APP_VERSION: local
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - wecooked-data:/data
    restart: unless-stopped

volumes:
  wecooked-data:
